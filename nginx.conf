server {
    listen 80;
    client_max_body_size 50M;          # allow X-ray / CT uploads

    root /usr/share/nginx/html;
    index index.html;

    # send API calls to the backend container
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;       # Full Screening can take time
    }

    # React app
    location / {
        try_files $uri $uri/ /index.html;
    }
}